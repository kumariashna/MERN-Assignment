<!-- Build an e-commerce product specification table -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Specifications</title>
</head>
<body>
    <h1>Online Store - Product Details</h1>

    <table border="1" cellpadding="10" cellspacing="0">
        <caption>Product Specification Table</caption>

        <thead>
            <tr>
                <th>Product ID</th>
                <th>Product Name</th>
                <th>Brand</th>
                <th>Price</th>
                <th>Color</th>
                <th>Warranty</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>101</td>
                <td>Laptop</td>
                <td>HP</td>
                <td>₹55,000</td>
                <td>Silver</td>
                <td>1 Year</td>
            </tr>

            <tr>
                <td>102</td>
                <td>Smartphone</td>
                <td>Samsung</td>
                <td>₹20,000</td>
                <td>Black</td>
                <td>1 Year</td>
            </tr>

            <tr>
                <td>103</td>
                <td>Headphones</td>
                <td>Sony</td>
                <td>₹3,000</td>
                <td>Blue</td>
                <td>6 Months</td>
            </tr>

            <tr>
                <td>104</td>
                <td>Keyboard</td>
                <td>Logitech</td>
                <td>₹1,500</td>
                <td>White</td>
                <td>1 Year</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
